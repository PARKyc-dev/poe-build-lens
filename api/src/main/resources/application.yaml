spring:
  application:
    name: poe-lens
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/poe-lens
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

poe-lens:
  openai:
    enabled: true
    api-key: ${OPENAI_API_KEY:}
    model: gpt-5.6-luna
